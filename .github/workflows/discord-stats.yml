name: Discord Stats

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  send-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch & Send Stats
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          LANYARD=$(curl -s "https://api.lanyard.rest/v1/users/1031939942831628320")
          STATUS=$(echo $LANYARD | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['discord_status'])")
          NAME=$(echo $LANYARD | python3 -c "import sys,json; d=json.load(sys.stdin); u=d['data']['discord_user']; print(u.get('global_name') or u['username'])")
          SPOTIFY=$(echo $LANYARD | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['data']
          if d.get('listening_to_spotify') and d.get('spotify'):
            sp=d['spotify']
            print(sp['song']+' — '+sp['artist'])
          else:
            print('not listening')
          ")

          LFM=$(curl -s "https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=vrabecak&api_key=53c767de1422b16575a82dd00b73f466&format=json&limit=1")
          TRACK=$(echo $LFM | python3 -c "import sys,json; t=json.load(sys.stdin)['recenttracks']['track']; tr=t[0] if isinstance(t,list) else t; print(tr['name']+' — '+tr['artist']['#text'])")
          SCROBBLES=$(curl -s "https://ws.audioscrobbler.com/2.0/?method=user.getinfo&user=vrabecak&api_key=53c767de1422b16575a82dd00b73f466&format=json" | python3 -c "import sys,json; print(json.load(sys.stdin)['user']['playcount'])")

          STATUS_EMOJI=$(python3 -c "
          s='$STATUS'
          print({'online':'🟢','idle':'🟡','dnd':'🔴'}.get(s,'⚫'))
          ")

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$STATUS_EMOJI vrabec — live stats\",
                \"color\": 7340031,
                \"fields\": [
                  {\"name\": \"Discord\", \"value\": \"\`$STATUS\`\", \"inline\": true},
                  {\"name\": \"Spotify\", \"value\": \"\`$SPOTIFY\`\", \"inline\": false},
                  {\"name\": \"Last.fm — last track\", \"value\": \"\`$TRACK\`\", \"inline\": false},
                  {\"name\": \"Total scrobbles\", \"value\": \"\`$SCROBBLES\`\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"potatogpu.lol\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"
